<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>EarthZoom 3D Pro Max • Bản Đồ Vệ Tinh &amp; Địa Hình Thật</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#03050a" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #020308;
      color: #f4f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 42%, #071124 0%, #020308 72%, #000000 100%);
    }

    /* Subtle starfield behind the 3D globe */
    #starsCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    #map { z-index: 1; }

    .safe-top {
      padding-top: max(10px, env(safe-area-inset-top, 10px));
    }
    .safe-bottom {
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
    }

    .glass-hud {
      background: rgba(8, 11, 20, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom pulsing pin marker */
    .earth-pin {
      position: relative;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .earth-pin-core {
      position: absolute;
      inset: 4px;
      border-radius: 9999px;
      background: #00f5ff;
      border: 2px solid #ffffff;
      box-shadow: 0 0 14px rgba(0, 245, 255, 0.95);
    }
    @keyframes pinPulse {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .earth-pin-ring {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 2px solid #00f5ff;
      animation: pinPulse 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    /* Hide MapLibre default attribution clutter on small screen while keeping clean link */
    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left {
      display: none !important;
    }
  </style>
</head>
<body class="relative select-none">

  <canvas id="starsCanvas"></canvas>
  <div id="map"></div>

  <!-- TOP FLOATING HUD -->
  <header class="safe-top fixed top-0 left-0 right-0 z-20 px-3 pointer-events-none flex flex-col items-center gap-2">
    <div class="w-full max-w-[540px] flex items-center justify-between gap-2 pointer-events-auto">
      <a href="../" class="glass-hud h-9 px-3 rounded-full flex items-center gap-1.5 text-xs font-bold text-zinc-100 hover:bg-white/10 transition">
        <i data-lucide="chevron-left" class="w-4 h-4 text-cyan-300"></i>
        <span>Bio</span>
      </a>

      <!-- Live Telemetry Pill -->
      <div class="glass-hud h-9 px-3.5 rounded-full flex items-center gap-2.5 text-[11px] font-mono">
        <span id="hudCoords" class="text-cyan-300 font-bold">20.8449, 106.6881</span>
        <span class="text-white/25">|</span>
        <span id="hudAlt" class="text-zinc-200">12,740 km</span>
      </div>

      <button id="btnMyLocation" type="button" title="Vị trí hiện tại của bạn" class="glass-hud w-9 h-9 rounded-full flex items-center justify-center text-cyan-300 hover:bg-white/10 transition">
        <i data-lucide="locate-fixed" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Search Bar + Photo EXIF Trigger -->
    <div class="w-full max-w-[540px] flex items-center gap-1.5 pointer-events-auto">
      <div class="glass-hud flex-1 min-w-0 h-10 rounded-full px-3 flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 text-zinc-400 shrink-0"></i>
        <input id="searchInput" type="text" placeholder="Tìm địa điểm (vd: Cầu Rồng, Nhà hát lớn Hải Phòng, Tokyo...)" class="flex-1 min-w-0 bg-transparent text-xs text-white placeholder-zinc-400 focus:outline-none" />
        <button id="btnSearchGo" type="button" class="px-2.5 py-1 rounded-full bg-cyan-400 text-zinc-950 text-[11px] font-extrabold shrink-0">Tìm</button>
      </div>

      <label for="photoExifInput" title="Đọc tọa độ GPS từ ảnh chụp" class="glass-hud h-10 px-3 rounded-full flex items-center gap-1.5 text-xs font-bold text-amber-300 cursor-pointer hover:bg-white/10 shrink-0 transition">
        <i data-lucide="image-plus" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Ảnh GPS</span>
      </label>
      <input id="photoExifInput" type="file" accept="image/*" class="hidden" />
    </div>

    <!-- Quick Presets + Map Mode Pills -->
    <div class="w-full max-w-[540px] flex items-center gap-1.5 overflow-x-auto no-scrollbar pointer-events-auto pb-0.5">
      <button type="button" data-preset="106.6881,20.8449,Hải Phòng" class="preset-btn glass-hud shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold text-zinc-200 hover:border-cyan-400/50">Hải Phòng</button>
      <button type="button" data-preset="107.0843,20.9505,Vịnh Hạ Long" class="preset-btn glass-hud shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold text-zinc-200 hover:border-cyan-400/50">Hạ Long</button>
      <button type="button" data-preset="105.8542,21.0285,Hồ Gươm • Hà Nội" class="preset-btn glass-hud shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold text-zinc-200 hover:border-cyan-400/50">Hà Nội</button>
      <button type="button" data-preset="108.2270,16.0610,Cầu Rồng • Đà Nẵng" class="preset-btn glass-hud shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold text-zinc-200 hover:border-cyan-400/50">Đà Nẵng</button>
      <button type="button" data-preset="106.7219,10.7950,Landmark 81 • TP.HCM" class="preset-btn glass-hud shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold text-zinc-200 hover:border-cyan-400/50">TP.HCM</button>
      <button type="button" data-preset="139.7454,35.6586,Tokyo Tower" class="preset-btn glass-hud shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold text-zinc-200 hover:border-cyan-400/50">Tokyo</button>
      <button type="button" data-preset="2.2945,48.8584,Tháp Eiffel • Paris" class="preset-btn glass-hud shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold text-zinc-200 hover:border-cyan-400/50">Paris</button>
    </div>
  </header>

  <!-- BOTTOM FLOATING ACTION DOCK -->
  <footer class="safe-bottom fixed bottom-0 left-0 right-0 z-20 px-3 pointer-events-none flex flex-col items-center gap-2">
    <!-- Active Target Banner -->
    <div class="w-full max-w-[540px] glass-hud rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2 pointer-events-auto">
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-cyan-400 shrink-0"></span>
          <span id="targetTitle" class="text-xs font-extrabold text-white truncate">Hải Phòng, Việt Nam</span>
        </div>
        <div id="targetSub" class="text-[10.5px] text-zinc-400 truncate mt-0.5">Vệ tinh Esri World Imagery • Địa hình 3D thật</div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btnToggleLabels" type="button" class="px-2.5 py-1.5 rounded-xl bg-cyan-500/20 border border-cyan-400/45 text-[10.5px] font-bold text-cyan-200">
          Tên địa danh
        </button>
        <button id="btnToggleTerrain" type="button" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-400/45 text-[10.5px] font-bold text-emerald-200">
          Địa hình 3D
        </button>
      </div>
    </div>

    <!-- Main Controls -->
    <div class="w-full max-w-[540px] flex items-center gap-2 pointer-events-auto">
      <button id="btnDive" type="button" class="flex-1 h-11 rounded-2xl bg-gradient-to-r from-cyan-400 to-sky-400 text-zinc-950 text-xs font-black flex items-center justify-center gap-1.5 shadow-[0_8px_24px_rgba(0,245,255,0.35)] active:scale-95 transition">
        <i data-lucide="rocket" class="w-4 h-4"></i>
        <span>Bay Từ Vũ Trụ</span>
      </button>

      <button id="btnOrbit" type="button" class="h-11 px-3.5 rounded-2xl glass-hud text-xs font-bold text-white flex items-center justify-center gap-1.5 hover:bg-white/10 active:scale-95 transition">
        <i data-lucide="rotate-3d" class="w-4 h-4 text-fuchsia-300"></i>
        <span>Xoay 360°</span>
      </button>

      <button id="btnRecord" type="button" title="Quay video zoom" class="h-11 px-3.5 rounded-2xl glass-hud text-xs font-bold text-rose-300 flex items-center justify-center gap-1.5 hover:bg-white/10 active:scale-95 transition">
        <i data-lucide="video" class="w-4 h-4"></i>
        <span id="recLabel">Quay</span>
      </button>

      <button id="btnSnapshot" type="button" title="Chụp ảnh vệ tinh HD" class="h-11 w-11 rounded-2xl glass-hud text-zinc-100 flex items-center justify-center hover:bg-white/10 active:scale-95 transition">
        <i data-lucide="camera" class="w-4 h-4"></i>
      </button>
    </div>
  </footer>

  <!-- Toast -->
  <div id="toast" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 px-4 py-2 rounded-full bg-zinc-950/90 border border-cyan-400/45 text-xs font-semibold text-cyan-200 shadow-2xl whitespace-nowrap pointer-events-none"></div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs';

    lucide.createIcons();

    // ==================== STARFIELD BACKGROUND ====================
    const starsCanvas = document.getElementById('starsCanvas');
    const sCtx = starsCanvas.getContext('2d');
    const stars = Array.from({ length: 160 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.3 + 0.3,
      a: Math.random() * 0.65 + 0.25,
      tw: Math.random() * 0.02 + 0.005,
    }));
    function resizeStars() {
      starsCanvas.width = window.innerWidth;
      starsCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeStars);
    resizeStars();
    function drawStars() {
      const w = starsCanvas.width, h = starsCanvas.height;
      sCtx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.a += s.tw;
        if (s.a > 0.95 || s.a < 0.2) s.tw *= -1;
        sCtx.fillStyle = `rgba(220, 238, 255, ${s.a.toFixed(2)})`;
        sCtx.beginPath();
        sCtx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
        sCtx.fill();
      }
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // ==================== TOAST ====================
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 2600);
    }

    // ==================== STATE ====================
    let targetLng = 106.6881;
    let targetLat = 20.8449;
    let targetName = 'Hải Phòng, Việt Nam';
    let labelsVisible = true;
    let terrainEnabled = true;
    let isOrbiting = false;
    let orbitRaf = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    // ==================== MAPLIBRE 3D GLOBE + REAL SATELLITE + 3D TERRAIN ====================
    const map = new maplibregl.Map({
      container: 'map',
      center: [targetLng, targetLat],
      zoom: 1.6,
      pitch: 12,
      bearing: 0,
      maxPitch: 82,
      canvasContextAttributes: { preserveDrawingBuffer: true },
      attributionControl: false,
      style: {
        version: 8,
        projection: { type: 'globe' },
        sources: {
          satellite: {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            maxzoom: 18
          },
          labels: {
            type: 'raster',
            tiles: [
              'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            maxzoom: 18
          },
          terrainDem: {
            type: 'raster-dem',
            tiles: [
              'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{y}/{x}.png'
            ],
            encoding: 'terrarium',
            tileSize: 256,
            maxzoom: 15
          }
        },
        layers: [
          { id: 'satellite', type: 'raster', source: 'satellite' },
          { id: 'labels', type: 'raster', source: 'labels', paint: { 'raster-opacity': 0.92 } }
        ],
        sky: {
          'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0]
        },
        light: {
          anchor: 'map',
          position: [1.5, 90, 80]
        }
      }
    });

    // Pulsing Target Marker
    const pinEl = document.createElement('div');
    pinEl.className = 'earth-pin';
    pinEl.innerHTML = '<div class="earth-pin-ring"></div><div class="earth-pin-core"></div>';
    const marker = new maplibregl.Marker({ element: pinEl })
      .setLngLat([targetLng, targetLat])
      .addTo(map);

    map.on('load', () => {
      try {
        map.setTerrain({ source: 'terrainDem', exaggeration: 1.5 });
      } catch (e) {}
    });

    // Live HUD update
    function updateHud() {
      const c = map.getCenter();
      const z = map.getZoom();
      document.getElementById('hudCoords').textContent = `${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`;
      const altKm = 40075 / Math.pow(2, z + 1);
      document.getElementById('hudAlt').textContent = altKm >= 1
        ? `${Math.round(altKm).toLocaleString('en-US')} km`
        : `${Math.max(30, Math.round(altKm * 1000))} m`;
    }
    map.on('move', updateHud);
    map.on('zoom', updateHud);
    updateHud();

    // ==================== CINEMATIC DIVE FROM SPACE ====================
    function stopOrbit() {
      isOrbiting = false;
      if (orbitRaf) cancelAnimationFrame(orbitRaf);
      orbitRaf = null;
    }

    function startOrbit() {
      stopOrbit();
      isOrbiting = true;
      function step() {
        if (!isOrbiting) return;
        map.setBearing((map.getBearing() + 0.25) % 360);
        orbitRaf = requestAnimationFrame(step);
      }
      orbitRaf = requestAnimationFrame(step);
    }

    function diveToTarget(lng, lat, name) {
      stopOrbit();
      targetLng = lng;
      targetLat = lat;
      targetName = name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      marker.setLngLat([lng, lat]);
      document.getElementById('targetTitle').textContent = targetName;

      // Stage 1: Pull out to outer space globe
      map.flyTo({
        center: [lng, lat],
        zoom: 1.4,
        pitch: 0,
        bearing: 0,
        duration: 1400,
        essential: true
      });

      map.once('moveend', () => {
        // Stage 2: Smooth dive down to rooftop / 3D terrain level
        map.flyTo({
          center: [lng, lat],
          zoom: 16.4,
          pitch: 62,
          bearing: 28,
          speed: 0.9,
          curve: 1.65,
          essential: true
        });

        map.once('moveend', () => {
          showToast('Đã hạ cánh tới ' + targetName);
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            setTimeout(() => stopRecording(), 1200);
          }
        });
      });
    }

    document.getElementById('btnDive').addEventListener('click', () => {
      diveToTarget(targetLng, targetLat, targetName);
    });

    document.getElementById('btnOrbit').addEventListener('click', () => {
      if (isOrbiting) {
        stopOrbit();
        showToast('Đã dừng xoay 360°');
      } else {
        if (map.getZoom() < 11) {
          map.easeTo({ pitch: 60, zoom: 15.5, duration: 1200 });
        }
        startOrbit();
        showToast('Đang xoay drone 360° quanh mục tiêu');
      }
    });

    // ==================== LAYER TOGGLES ====================
    document.getElementById('btnToggleLabels').addEventListener('click', (e) => {
      labelsVisible = !labelsVisible;
      try {
        map.setLayoutProperty('labels', 'visibility', labelsVisible ? 'visible' : 'none');
      } catch (err) {}
      e.currentTarget.classList.toggle('bg-cyan-500/20', labelsVisible);
      e.currentTarget.classList.toggle('bg-white/10', !labelsVisible);
      showToast(labelsVisible ? 'Đã bật tên địa danh' : 'Đã tắt tên địa danh (vệ tinh thuần)');
    });

    document.getElementById('btnToggleTerrain').addEventListener('click', (e) => {
      terrainEnabled = !terrainEnabled;
      try {
        map.setTerrain(terrainEnabled ? { source: 'terrainDem', exaggeration: 1.5 } : null);
      } catch (err) {}
      e.currentTarget.classList.toggle('bg-emerald-500/20', terrainEnabled);
      e.currentTarget.classList.toggle('bg-white/10', !terrainEnabled);
      showToast(terrainEnabled ? 'Đã bật địa hình 3D thật' : 'Đã chuyển sang mặt phẳng');
    });

    // ==================== PRESETS & GEOCODING ====================
    document.querySelectorAll('.preset-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const parts = btn.getAttribute('data-preset').split(',');
        const lng = parseFloat(parts[0]);
        const lat = parseFloat(parts[1]);
        const name = parts[2];
        diveToTarget(lng, lat, name);
      });
    });

    async function searchPlace() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      showToast('Đang tìm tọa độ vệ tinh...');
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data[0]) {
          const lng = parseFloat(data[0].lon);
          const lat = parseFloat(data[0].lat);
          const display = data[0].display_name.split(',').slice(0, 2).join(', ');
          diveToTarget(lng, lat, display);
        } else {
          showToast('Không tìm thấy địa điểm này');
        }
      } catch (err) {
        showToast('Lỗi kết nối tìm kiếm địa điểm');
      }
    }
    document.getElementById('btnSearchGo').addEventListener('click', searchPlace);
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchPlace();
    });

    // ==================== GEOLOCATION ====================
    document.getElementById('btnMyLocation').addEventListener('click', () => {
      if (!navigator.geolocation) {
        showToast('Trình duyệt không hỗ trợ GPS');
        return;
      }
      showToast('Đang xác định GPS của bạn...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          diveToTarget(pos.coords.longitude, pos.coords.latitude, 'Vị trí hiện tại của bạn');
        },
        () => showToast('Bạn chưa cấp quyền vị trí cho Safari'),
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });

    // ==================== PURE-JS BINARY EXIF GPS PARSER ====================
    function parseExifGps(buffer) {
      const view = new DataView(buffer);
      if (view.getUint16(0, false) !== 0xFFD8) return null;
      let offset = 2;
      const len = view.byteLength;
      while (offset < len - 4) {
        const marker = view.getUint16(offset, false);
        offset += 2;
        if (marker === 0xFFE1) {
          if (view.getUint32(offset + 2, false) !== 0x45786966) return null;
          const tiffStart = offset + 8;
          const little = view.getUint16(tiffStart, false) === 0x4949;
          const firstIfd = view.getUint32(tiffStart + 4, little);
          const ifd0 = tiffStart + firstIfd;
          const entries = view.getUint16(ifd0, little);
          let gpsIfdOffset = null;
          for (let i = 0; i < entries; i++) {
            const ent = ifd0 + 2 + i * 12;
            if (view.getUint16(ent, little) === 0x8825) {
              gpsIfdOffset = tiffStart + view.getUint32(ent + 8, little);
              break;
            }
          }
          if (!gpsIfdOffset) return null;
          const gpsEntries = view.getUint16(gpsIfdOffset, little);
          let latRef = 'N', lonRef = 'E', latArr = null, lonArr = null;
          const readRationals = (off) => {
            const arr = [];
            for (let k = 0; k < 3; k++) {
              const num = view.getUint32(off + k * 8, little);
              const den = view.getUint32(off + k * 8 + 4, little) || 1;
              arr.push(num / den);
            }
            return arr[0] + arr[1] / 60 + arr[2] / 3600;
          };
          for (let i = 0; i < gpsEntries; i++) {
            const ent = gpsIfdOffset + 2 + i * 12;
            const tag = view.getUint16(ent, little);
            if (tag === 1) latRef = String.fromCharCode(view.getUint8(ent + 8));
            if (tag === 2) latArr = readRationals(tiffStart + view.getUint32(ent + 8, little));
            if (tag === 3) lonRef = String.fromCharCode(view.getUint8(ent + 8));
            if (tag === 4) lonArr = readRationals(tiffStart + view.getUint32(ent + 8, little));
          }
          if (latArr != null && lonArr != null) {
            const lat = latRef === 'S' ? -latArr : latArr;
            const lng = lonRef === 'W' ? -lonArr : lonArr;
            return { lat, lng };
          }
          return null;
        } else if ((marker & 0xFF00) !== 0xFF00) {
          break;
        } else {
          offset += view.getUint16(offset, false);
        }
      }
      return null;
    }

    document.getElementById('photoExifInput').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const buf = await file.arrayBuffer();
        const gps = parseExifGps(buf);
        if (gps) {
          diveToTarget(gps.lng, gps.lat, `Tọa độ ảnh: ${file.name.slice(0, 20)}`);
        } else {
          showToast('Ảnh bị iOS ẩn GPS — hãy gõ tên địa điểm vào ô Tìm kiếm!');
        }
      } catch (err) {
        showToast('Không đọc được EXIF ảnh này');
      }
    });

    // ==================== VIDEO RECORD & SNAPSHOT ====================
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        document.getElementById('recLabel').textContent = 'Quay';
      }
    }

    document.getElementById('btnRecord').addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
        return;
      }
      const canvas = map.getCanvas();
      if (!canvas || typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined') {
        showToast('Safari hiện tại chưa hỗ trợ ghi trực tiếp — hãy dùng Quay màn hình iPhone!');
        return;
      }
      try {
        const stream = canvas.captureStream(30);
        const mime = MediaRecorder.isTypeSupported('video/mp4')
          ? 'video/mp4'
          : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        recordedChunks = [];
        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `earthzoom-${Date.now()}.${blob.type.includes('mp4') ? 'mp4' : 'webm'}`;
          a.click();
          showToast('Đã lưu video EarthZoom!');
        };
        mediaRecorder.start();
        document.getElementById('recLabel').textContent = 'Dừng';
        diveToTarget(targetLng, targetLat, targetName);
      } catch (err) {
        showToast('Hãy dùng Quay màn hình iPhone để lưu video 60fps nét nhất!');
      }
    });

    document.getElementById('btnSnapshot').addEventListener('click', () => {
      try {
        const dataUrl = map.getCanvas().toDataURL('image/png');
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `earthzoom-${Date.now()}.png`;
        a.click();
        showToast('Đã chụp ảnh vệ tinh HD!');
      } catch (err) {
        showToast('Không chụp được khung hình lúc đang tải tile');
      }
    });
  </script>
</body>
</html>
